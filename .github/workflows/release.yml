name: Release

# tag 椹卞姩鐨勫彂甯冩祦姘寸嚎锛氭帹閫?v* 鏍囩鍚庤嚜鍔ㄦ瀯寤?Windows 瀹夎鍖呭苟鍒涘缓 Draft Release銆?# 鍙戝竷娴佺▼瑙?CONTRIBUTING.md銆屽彂甯冩祦绋嬨€嶇珷鑺傘€?
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 鍒涘缓 Release 涓庝笂浼犱骇鐗╂墍蹇呴渶

jobs:
  windows:
    name: Windows NSIS 瀹夎鍖?    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 瀹夎渚濊禆
        run: npm ci
      - name: 鍑嗗 Python 鏋勫缓鐜
        run: python -m venv python-backend/.venv
      - name: 鏋勫缓 Python 鍚庣锛圥yInstaller 鈫?python-dist/锛?        run: npm run build:py
      # 涓庢湰鍦?build:win 鐨勫樊寮傦細CI 鏄叏鏂?checkout锛寁endor/ 涓虹┖锛?      # extraResources 浼氭妸 vendor/** 鎵撳叆瀹夎鍖咃紝蹇呴』鍏堝畬鏁村～鍏咃紝
      # 鍚﹀垯浜х墿缂哄皯 mpv/aria2c/ffmpeg锛屼笌寮€鍙戞満鏋勫缓鐨勫畨瑁呭寘涓嶄竴鑷淬€?      - name: 涓嬭浇鍏ㄩ儴绗笁鏂逛簩杩涘埗锛坢pv/aria2c/anime4k/ffmpeg/misans锛?        run: node scripts/download-binaries.js all
      - name: 鎵撳寘 Windows 瀹夎鍖?        run: npx electron-builder --win --publish never
      - name: 涓婁紶鏋勫缓鏋勪欢
        uses: actions/upload-artifact@v4
        with:
          name: yuki-windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: 鍒涘缓 Draft Release 骞舵寕杞藉畨瑁呭寘
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true # 缁存姢鑰呴殢鍚庢浛鎹负 CHANGELOG 鎻愮偧鐨勬寮?Notes 鍐?publish
          files: dist/*.exe

  # macOS / Linux 鎵撳寘涓庡畨瑁呭悗鍐峰惎鍔ㄩ獙璇佷粛鍦?PROGRESS.md 璁″垝鍐咃紝
