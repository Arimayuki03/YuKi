name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  js:
    name: JS 鍗曞厓娴嬭瘯 + 璇硶闂ㄧ
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # postinstall 鐨?download-binaries 宸插閿欙紙|| exit 0锛夛紝CI 鎷変笉鍒颁簩杩涘埗涓嶉樆濉?      - run: npm ci
      - name: 渚涘簲閾惧璁?        run: npm audit --omit=dev || true
        # 杩愯鏃朵緷璧栧璁★紙褰撳墠浠?electron 閾撅級锛涢杞瀵燂紝绋冲畾鍚庡幓鎺?|| true
      - run: npm run test:jsunit
      - run: npm run test:js

  python:
    name: Python 鍥炲綊锛坰moke/phase3/kazumi/jar + 缂栬瘧妫€鏌ワ級
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 瀹夎閿佸畾渚濊禆
        run: pip install -r python-backend/requirements.txt
      - name: 渚涘簲閾惧璁?        run: |
          pip install pip-audit
          pip-audit -r python-backend/requirements.txt --strict || true
          # --strict 澶辫触鏆備笉鎷︽埅锛堥杞熀绾垮厛瑙傚療锛夛紝绋冲畾鍚庡幓鎺?|| true
      - name: 杩愯鍚庣鍥炲綊
        run: python python-backend/tests/run_all.py
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8
        # jar-e2e 闃舵鍦ㄦ棤 JDK 鐜鑷姩璺宠繃锛況unner 鑷甫 Java 鍒欑湡璺?      - name: Ruff lint
        run: |
          pip install ruff
          ruff check python-backend

  # B3 鍚庣画澧炲己锛歵ag push 鏃剁殑 electron-builder 鏋勫缓浜х墿

  # 褰辫浠撳吋瀹规€у浠讹紙渚濊禆澶栫綉 + 杈冩參锛夛細鎵嬪姩瑙﹀彂
  compat:
    name: 褰辫浠撳吋瀹规€э紙21 浠撹鏂欙級
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: pip install -r python-backend/requirements.txt
      - run: python python-backend/tests/test_config_compat.py
