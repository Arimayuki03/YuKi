<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440">
  <!--
    封面兜底图（拉取失败/无封面统一占位）
    设计：暗绿渐变底 + 胶片齿孔 + 中央播放标志 + 骨架线，深浅色界面下观感一致
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26392F"/>
      <stop offset="0.55" stop-color="#1B2A22"/>
      <stop offset="1" stop-color="#131C16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6CDBA4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6CDBA4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CDBA4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6CDBA4" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- 背景与中央柔光 -->
  <rect width="320" height="440" fill="url(#bg)"/>
  <rect width="320" height="440" fill="url(#glow)"/>

  <!-- 上下胶片齿孔 -->
  <g fill="#6CDBA4" fill-opacity="0.10">
    <rect x="16"  y="12" width="22" height="14" rx="4"/>
    <rect x="54"  y="12" width="22" height="14" rx="4"/>
    <rect x="92"  y="12" width="22" height="14" rx="4"/>
    <rect x="130" y="12" width="22" height="14" rx="4"/>
    <rect x="168" y="12" width="22" height="14" rx="4"/>
    <rect x="206" y="12" width="22" height="14" rx="4"/>
    <rect x="244" y="12" width="22" height="14" rx="4"/>
    <rect x="282" y="12" width="22" height="14" rx="4"/>
    <rect x="16"  y="414" width="22" height="14" rx="4"/>
    <rect x="54"  y="414" width="22" height="14" rx="4"/>
    <rect x="92"  y="414" width="22" height="14" rx="4"/>
    <rect x="130" y="414" width="22" height="14" rx="4"/>
    <rect x="168" y="414" width="22" height="14" rx="4"/>
    <rect x="206" y="414" width="22" height="14" rx="4"/>
    <rect x="244" y="414" width="22" height="14" rx="4"/>
    <rect x="282" y="414" width="22" height="14" rx="4"/>
  </g>

  <!-- 中央播放标志：光晕 + 双圈 + 三角 -->
  <circle cx="160" cy="186" r="86" fill="#6CDBA4" fill-opacity="0.07"/>
  <circle cx="160" cy="186" r="66" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <circle cx="160" cy="186" r="80" fill="none" stroke="#6CDBA4" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M142 154l56 32-56 32z" fill="#6CDBA4" fill-opacity="0.85"/>

  <!-- 骨架线（暗示标题与副标题缺失） -->
  <rect x="70" y="316" width="180" height="12" rx="6" fill="#6CDBA4" fill-opacity="0.15"/>
  <rect x="100" y="342" width="120" height="9" rx="4.5" fill="#6CDBA4" fill-opacity="0.09"/>

  <!-- 文案 -->
  <text x="160" y="386" font-size="17" text-anchor="middle" fill="#6CDBA4" fill-opacity="0.5" font-family="sans-serif" letter-spacing="4">暂无封面</text>
</svg>
